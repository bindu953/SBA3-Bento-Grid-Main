<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Frontend Mentor Bento Grid recreated with Bootstrap 5.">
  <title>Frontend Mentor | Bento Grid</title>
  <link rel="icon" type="image/png" href="./assets/images/favicon-32x32.png">

  <!-- Font from the Frontend Mentor style guide -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400;1,9..40,500&display=swap"
    rel="stylesheet">

  <!-- Bootstrap first; small Figma-specific overrides second -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"
    defer></script>

  <!-- Linking custom Style.css -->
  <link rel="stylesheet" href="./style.css">
</head>

<body class="bg-body-tertiary">
  <main class="container-xxl py-4 py-xl-5" aria-label="Social media tools bento grid">
    <h1 class="visually-hidden">Social media tools and benefits</h1>

    <!-- Bootstrap 12-column outer row: 3 + 9 on desktop -->
    <div class="row g-4 align-items-stretch">

      <!-- LEFT STACK: moves below the others on mobile/tablet -->
      <div class="col-12 col-xl-3 order-2 order-xl-1">
        <div class="d-flex flex-column flex-md-row flex-xl-column gap-4 left-stack">

          <article class="card create-card border-0 rounded-3 p-4 d-flex flex-column justify-content-center gap-4">
            <h2 class="card-preset2 mb-0">Create and schedule content <em>quicker.</em></h2>
            <img class="img-fluid create-image" src="./assets/images/illustration-create-post.webp"
              alt="Create Post button">
          </article>

          <article class="card ai-card border-0 rounded-3 p-4 d-flex flex-column justify-content-between gap-4">
            <h2 class="card-preset2 mb-0">Write your content using AI.</h2>
            <img class="img-fluid ai-image" src="./assets/images/illustration-ai-content.webp"
              alt="AI-assisted social media writing interface">
          </article>
        </div>
      </div>

      
    </div>
  </main>
</body>

</html>
